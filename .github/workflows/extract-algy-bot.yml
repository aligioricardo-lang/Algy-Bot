name: Colocar ALGY-BOT-V4.9 na raiz

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair conteúdo para a página principal
        shell: bash
        run: |
          set -euo pipefail
          test -f ALGY-BOT-V4.9.zip
          rm -rf .extract-tmp
          mkdir -p .extract-tmp
          unzip -oq ALGY-BOT-V4.9.zip -d .extract-tmp

          top_dirs=(.extract-tmp/*/)
          if [ "${#top_dirs[@]}" -eq 1 ] && [ -d "${top_dirs[0]}" ]; then
            src="${top_dirs[0]}"
          else
            src=".extract-tmp"
          fi

          # Coloca o conteúdo de ALGY-BOT-V4.9 diretamente na raiz,
          # preservando as subpastas internas necessárias ao funcionamento do bot.
          cp -a "$src"/. ./

          rm -rf ALGY-BOT-V4.9
          rm -rf .extract-tmp
          rm -f ALGY-BOT-V4.9.zip

      - name: Verificar resultado
        shell: bash
        run: |
          set -euo pipefail
          test ! -d ALGY-BOT-V4.9
          test ! -f ALGY-BOT-V4.9.zip
          echo 'Conteúdo principal após a organização:'
          find . -maxdepth 2 -not -path './.git*' -print | sort

      - name: Guardar alterações no GitHub
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para commitar.'
          else
            git commit -m 'Organizar ALGY-BOT-V4.9 diretamente na raiz'
            git push
          fi
