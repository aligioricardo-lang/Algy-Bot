name: Extrair ALGY-BOT-V4.9 para a raiz

on:
  push:
    branches: [main]
    paths:
      - 'ALGY-BOT-V4.9.zip'
      - '.github/workflows/extract-algy-bot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair e colocar o conteúdo na página principal
        shell: bash
        run: |
          set -euo pipefail
          test -f ALGY-BOT-V4.9.zip
          rm -rf .extract-tmp
          mkdir -p .extract-tmp
          unzip -oq ALGY-BOT-V4.9.zip -d .extract-tmp

          # Detecta a pasta única criada pelo ZIP (ex.: ALGY-BOT-V4.9)
          top_dirs=(.extract-tmp/*/)
          if [ "${#top_dirs[@]}" -eq 1 ] && [ -d "${top_dirs[0]}" ]; then
            src="${top_dirs[0]}"
          else
            src=".extract-tmp"
          fi

          # Move o conteúdo da pasta para a raiz, sem alterar a estrutura interna.
          cp -a "$src"/. ./

          # Remove a pasta contêiner antiga, caso exista.
          rm -rf ALGY-BOT-V4.9
          rm -rf .extract-tmp

          # O ZIP não precisa permanecer como pasta/arquivo de código na raiz.
          rm -f ALGY-BOT-V4.9.zip

      - name: Verificar estrutura final
        shell: bash
        run: |
          set -euo pipefail
          echo 'Estrutura final da raiz:'
          find . -maxdepth 2 -not -path './.git*' -print | sort
          test ! -d ALGY-BOT-V4.9

      - name: Commitar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para commitar.'
          else
            git commit -m 'Colocar conteúdo do ALGY-BOT-V4.9 na raiz'
            git push
          fi
